@if (isLogged) {
  <header class="app-header">
 <div class="left-area">
    <button class="icon-logout" (click)="logout()" title="יציאה">
      <!-- simple logout icon -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 17L21 12L16 7" stroke="#374151" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 12H9" stroke="#374151" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 19H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" stroke="#374151" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="center-area">
    <div class="brand-title">Task Manager</div>
  </div>

  <div class="right-area">
<div class="user-name">{{ userName ? userName : 'אין שם' }}</div>
    <div class="avatar-icon" [style.background]="avatarColor">
      <!-- person SVG icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="7" r="4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</header>
}
