<div class="login-container" dir="rtl">
  <div class="login-card">
    <h2>ברוכים הבאים</h2>
    <p>התחבר כדי לנהל את המשימות שלך</p>

    @if (message) {
      <div class="error-alert">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ message }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>מייל</label>
        <input type="email" formControlName="email" placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label>סיסמה</label>
        <input type="password" formControlName="password" placeholder="הקלד סיסמה...">
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="login-btn">
        כניסה למערכת
      </button>
      
      <p class="switch-auth">
        עוד לא רשומה? <a (click)="goToRegister()">צרי חשבון חדש</a>
      </p>
    </form>
  </div>
</div>
