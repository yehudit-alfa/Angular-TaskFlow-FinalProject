<div class="projects-container" dir="rtl">
  <div class="main-wrapper"> 
    @if (message) {
      <div [class]="'toast ' + messageType">{{ message }}</div>
    }

    <div class="header-section">
      <h2>הפרויקטים של הצוות</h2>
    </div>

    <div class="create-box">
      <h3>יצירת פרויקט חדש</h3>
      <form #projectForm="ngForm" (ngSubmit)="onCreateProject(projectForm)">
        <label>שם פרויקט <span style="color: red">*</span></label>
        <input
          type="text"
          [(ngModel)]="newProjectName"
          #projectNameModel="ngModel"
          name="projectName"
          required
          placeholder="שם הפרויקט...">
        <textarea [(ngModel)]="newProjectDescription" name="projectDescription" placeholder="מה המטרה של הפרויקט הזה?"></textarea>
        <div class="create-actions">
          <button type="submit" class="btn-create" [disabled]="!newProjectName.trim() || isCreatingProject">+ צור פרויקט</button>
        </div>
      </form>
    </div>

    @if (projects.length === 0) {
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
        </div>
        <h3>אין פרויקטים להצגה</h3>
        <p>מחכה להוספת הפרויקט הראשון שלך!</p>
      </div>
    } @else {
      <div class="projects-grid">
        @for (project of projects; track project.id) {
          <div class="project-card">
            <button class="delete-icon-btn" (click)="onDeleteProject(project.id)" title="Delete project" aria-label="Delete project">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
              </svg>
            </button>
            <div class="project-content">
              <h3>{{ project.name }}</h3>
              <p>{{ project.description || 'אין תיאור' }}</p>
            </div>
            <button class="btn-manage" (click)="goToTasks(project.id)">ניהול משימות</button>
          </div>
        }
      </div>
    }
  </div> 
</div>
