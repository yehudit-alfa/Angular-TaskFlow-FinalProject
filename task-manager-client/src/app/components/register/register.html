<div class="login-container" dir="rtl">
    <div class="login-card">
    <h2>יצירת חשבון</h2>
    <p>הצטרפי למערכת ניהול המשימות</p>

    <div style="min-height: 60px;">
      @if (errorMessage) {
        <div class="error-alert">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>
      }
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>שם מלא</label>
        <input type="text" formControlName="name" placeholder="הכניסי שם מלא..." (input)="errorMessage = null">
      </div>

      <div class="form-group">
        <label>אימייל</label>
        <input type="email" formControlName="email" placeholder="example@mail.com" (input)="errorMessage = null">
      </div>

      <div class="form-group">
        <label>סיסמה</label>
        <input type="password" formControlName="password" placeholder="לפחות 6 תווים..." (input)="errorMessage = null">
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isSubmitting" class="login-btn">
        הרשמה וכניסה
      </button>
      
      <div class="switch-auth">
        כבר רשומה? <a (click)="goToLogin()">חזרי להתחברות</a>
      </div>
    </form>
  </div>
</div>
